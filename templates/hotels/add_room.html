{% extends 'base.html' %}{% block title %}Add Room – {{ hotel.name }}{% endblock %}{% block content %}
<div class="container py-4" style="max-width:800px;"><h2 class="mb-1" style="font-family:var(--ff-head);"><i class="fas fa-bed text-primary me-2"></i>Add Room</h2><p class="text-muted mb-4">for <strong>{{ hotel.name }}</strong></p>
<div class="planner-card"><form method="post" action="/hotels/hotel-dashboard/{{ hotel.id }}/add-room/" enctype="multipart/form-data">{% csrf_token %}
<div class="row g-3">
  <div class="col-md-6"><label class="form-label">Room Type *</label><select name="room_type" class="form-select" required>{% for v,l in room_types %}<option value="{{ v }}" {% if form_data.room_type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">Room Number *</label><input type="text" name="room_number" class="form-control" value="{{ form_data.room_number|default:'' }}" placeholder="e.g. 101" required></div>
  <div class="col-md-4"><label class="form-label">Capacity (guests)</label><input type="number" name="capacity" class="form-control" value="{{ form_data.capacity|default:2 }}" min="1" max="10"></div>
  <div class="col-md-4"><label class="form-label">Price per Night (₹) *</label><input type="number" step="0.01" name="price_per_night" class="form-control" value="{{ form_data.price_per_night|default:'' }}" required></div>
  <div class="col-md-4 d-flex align-items-end gap-3">
    <div class="form-check"><input class="form-check-input" type="checkbox" name="has_ac" id="has_ac" checked><label class="form-check-label" for="has_ac">AC</label></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="has_wifi" id="has_wifi" checked><label class="form-check-label" for="has_wifi">WiFi</label></div>
  </div>
  <div class="col-12"><label class="form-label">Amenities (comma separated)</label><input type="text" name="amenities" class="form-control" value="{{ form_data.amenities|default:'' }}" placeholder="TV, Mini bar, Balcony"></div>
  <div class="col-12"><label class="form-label">Room Photo</label><input type="file" name="thumbnail" class="form-control" accept="image/*"></div>
  <div class="col-12"><button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-check me-2"></i>Add Room</button> <a href="/hotels/hotel-dashboard/" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a></div>
</div>
</form></div></div>{% endblock %}
